<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="40" viewBox="0 0 840 40" fill="none" role="img" aria-label=""><title></title><style>text{font-family:PFB,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.h{font-family:PFH,PFB,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace}@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none;filter:none}}.e{transform-box:fill-box;transform-origin:center;animation:in 0.80s cubic-bezier(.16,1,.3,1) both}.gx{transform-box:fill-box;transform-origin:left center;animation:gx 0.90s cubic-bezier(.16,1,.3,1) both}.gy{transform-box:fill-box;transform-origin:center bottom;animation:gy 0.80s cubic-bezier(.16,1,.3,1) both}.dg{transform-box:fill-box;transform-origin:center;animation:dg 0.60s cubic-bezier(.16,1,.3,1) both}@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes dg{from{transform:scale(0)}to{transform:scale(1)}}.ro{animation:ro 1.60s cubic-bezier(.3,.9,.2,1) both}.r0{animation-name:r0}@keyframes r0{from{transform:translateY(0)}to{transform:translateY(-0em)}}.r1{animation-name:r1}@keyframes r1{from{transform:translateY(0)}to{transform:translateY(-1.25em)}}.r2{animation-name:r2}@keyframes r2{from{transform:translateY(0)}to{transform:translateY(-2.5em)}}.r3{animation-name:r3}@keyframes r3{from{transform:translateY(0)}to{transform:translateY(-3.75em)}}.r4{animation-name:r4}@keyframes r4{from{transform:translateY(0)}to{transform:translateY(-5em)}}.r5{animation-name:r5}@keyframes r5{from{transform:translateY(0)}to{transform:translateY(-6.25em)}}.r6{animation-name:r6}@keyframes r6{from{transform:translateY(0)}to{transform:translateY(-7.5em)}}.r7{animation-name:r7}@keyframes r7{from{transform:translateY(0)}to{transform:translateY(-8.75em)}}.r8{animation-name:r8}@keyframes r8{from{transform:translateY(0)}to{transform:translateY(-10em)}}.r9{animation-name:r9}@keyframes r9{from{transform:translateY(0)}to{transform:translateY(-11.25em)}}.fl{transform-box:fill-box;transform-origin:center;animation:fl 9.0s ease-in-out infinite}.tw{animation:tw 2.4s ease-in-out infinite}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-7px)}}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}@keyframes ping{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(2.1);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="gx" style="animation-delay:0.05s" x="40" y="19.3" width="760" height="1.5" rx="0.8" fill="#1fb5bc"/></svg>